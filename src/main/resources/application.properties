# JPA/Hibernate settings
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# Disable SQL initialization to avoid circular dependency



# CORS (optional, aligns with your CorsConfig.java)
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*

# Encryption and defaults
aesSecretKey=k
encryption.key=5v5iteSYS  # Keep for compatibility, if needed elsewhere
default.clinicId=1
default.createdById=1
#database.default-schema=test_migration

# Debug logging
logging.level.org.springframework=DEBUG
logging.level.com.pappyjoe.pappybridge=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB